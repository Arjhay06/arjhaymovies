<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arjhay TV</title>

  <link rel="stylesheet" href="home.css" />
  <script defer src="home.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="intro-splash" id="intro-splash">
    <div class="intro-logo">Arjhay<span>TV</span></div>
  </div>

  <div class="page-loader" id="page-loader">
    <div class="loader-ring"></div>
    <div class="loader-brand">Arjhay<span>TV</span></div>
  </div>

  <header class="top-nav" id="top-nav">
    <div class="nav-left">
      <a href="index.html" class="brand">Arjhay<span>TV</span></a>

      <nav class="nav-tabs">
        <a href="index.html?tab=home" class="nav-tab active" data-tab="home">Home</a>
        <a href="index.html?tab=movies" class="nav-tab" data-tab="movies">Movies</a>
        <a href="index.html?tab=tvshows" class="nav-tab" data-tab="tvshows">TV Shows</a>
      </nav>
    </div>

    <div class="nav-right">
      <div class="nav-search" id="nav-search">
        <button type="button" class="nav-search-btn" onclick="toggleNavSearch()" aria-label="Search">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <input type="text" id="search-input" class="nav-search-input" placeholder="Titles, people, genres" oninput="searchTMDB()" aria-label="Search titles" />
      </div>
    </div>
  </header>

  <main class="page-shell">
    <!-- HERO -->
    <section class="hero-banner" id="hero-banner">
      <div class="hero-backdrop" id="hero-backdrop"></div>
      <div class="hero-vignette"></div>

      <button class="hero-mute" id="hero-mute" type="button" aria-label="Toggle sound">
        <i class="fa-solid fa-volume-xmark"></i>
      </button>

      <div class="hero-content">
        <h1 id="hero-title" class="hero-title">Loading...</h1>

        <div class="hero-meta">
          <span id="hero-type" class="hero-type">Movie</span>
          <span id="hero-year">2026</span>
          <span id="hero-rating">★ 7.8</span>
          <span id="hero-translation" class="hero-translation">Sub/Dub Available</span>
        </div>

        <p id="hero-overview" class="hero-overview">Please wait...</p>

        <div class="hero-actions">
          <button id="hero-watch-btn" class="hero-play-btn" type="button"><i class="fa-solid fa-play"></i> Play</button>
          <button id="hero-info-btn" class="hero-info-btn" type="button"><i class="fa-solid fa-circle-info"></i> More Info</button>
        </div>
      </div>

      <div class="hero-rank" id="hero-rank">
        <span class="hero-top10">TOP<br>10</span>
        <span id="hero-rank-text" class="hero-rank-text">#1 in Movies Today</span>
      </div>
    </section>


    <!-- CONTINUE -->
    <section class="section-block always-visible">
      <div class="section-head">
        <h2>Continue watching</h2>
        <a href="#" class="see-all" data-target="history-list">See all</a>
      </div>
      <div class="poster-row" id="history-list"></div>
    </section>

    <!-- MAIN MOVIES / MOVIES TAB / TV SHOWS TAB CONTENT -->
    <section class="section-block" data-main-section="movies">
      <div class="section-head">
        <h2 data-main-title>Trending movies</h2>
        <a href="#" class="see-all" data-target="movies-list">See all</a>
      </div>
      <div class="poster-row" id="movies-list"></div>
    </section>

    <!-- TOP RATED -->
    <section class="section-block" data-main-section="toprated">
      <div class="section-head">
        <h2>Top rated <span class="star">★</span></h2>
        <a href="#" class="see-all" data-target="tvshows-list">See all</a>
      </div>
      <div class="poster-row" id="tvshows-list"></div>
    </section>

    <!-- TRENDING ANIME -->
    <section class="section-block" data-main-section="anime">
      <div class="section-head">
        <h2>Trending anime</h2>
        <a href="#" class="see-all" data-target="anime-list">See all</a>
      </div>
      <div class="poster-row" id="anime-list"></div>
    </section>
  </main>

  <div class="search-modal" id="search-modal">
    <div class="search-panel">
      <div class="search-results-head">
        <span class="search-results-title">Search results</span>
        <button class="search-close" type="button" onclick="closeSearchModal()" aria-label="Close search">×</button>
      </div>
      <div class="search-results-grid" id="search-results"></div>
    </div>
  </div>
</body>
</html>

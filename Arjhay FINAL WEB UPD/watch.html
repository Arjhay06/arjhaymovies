<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arjhay TV - Watch</title>

  <link rel="stylesheet" href="home.css" />
  <script defer src="home.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main">
    <div class="page-loader show" id="page-loader">
      <div class="loader-ring"></div>
      <div class="loader-brand">Arjhay<span>TV</span></div>
    </div>

    <header class="top-nav" id="top-nav">
      <div class="nav-left">
        <a href="index.html" class="brand">Arjhay<span>TV</span></a>

        <nav class="nav-tabs">
          <a href="index.html?tab=home" class="nav-tab" data-tab="home">Home</a>
          <a href="index.html?tab=movies" class="nav-tab" data-tab="movies">Movies</a>
          <a href="index.html?tab=tvshows" class="nav-tab" data-tab="tvshows">TV Shows</a>
        </nav>
      </div>

      <div class="nav-right">
        <div class="nav-search" id="nav-search">
          <button type="button" class="nav-search-btn" onclick="toggleNavSearch()" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <input type="text" id="search-input" class="nav-search-input" placeholder="Titles, people, genres" oninput="searchTMDB()" aria-label="Search titles" />
        </div>
      </div>
    </header>

    <section class="watch-layout" id="watch-layout">
      <div class="watch-left">
        <div class="watch-player-wrap">
          <iframe
            id="modal-video"
            frameborder="0"
            allow="autoplay *; fullscreen *; encrypted-media *; picture-in-picture *; web-share *"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
          ></iframe>
        </div>

        <div class="watch-detail-card">
          <div class="watch-detail-top">
            <div class="watch-title-wrap">
              <h1 id="watch-title">Loading...</h1>

              <div class="watch-mini-meta">
                <span id="watch-type-badge" class="watch-type-badge">TV</span>
                <span id="watch-year">—</span>
                <span id="watch-rating">—</span>
                <span id="watch-runtime">—</span>
              </div>
            </div>

            <div class="watch-server-wrap">
              <label>Server</label>
              <button type="button" class="server-trigger" id="server-trigger" onclick="openServerPanel()">
                <i class="fa-solid fa-server"></i>
                <span id="server-trigger-name">Select server</span>
                <i class="fa-solid fa-chevron-down server-trigger-caret"></i>
              </button>
              <select id="server" class="visually-hidden" aria-hidden="true" tabindex="-1">
                <option value="vidstuck">VidStuck</option>
                <option value="vidsrc.party">Vidsrc Party</option>
                <option value="vidsrc.icu">Vidsrc.cc</option>
                <option value="player.videasy.net">Player.Videasy.net</option>
                <option value="2embed">2Embed</option>
                <option value="2Anime">2Anime</option>
                <option value="moviesapi.club animetv">MoviesAPI Club TV</option>
                <option value="multiembed.mov">MultiEmbed</option>
                <option value="apimocine-movie">ApiMocine Movie</option>
              </select>
            </div>
          </div>

          <p id="watch-description" class="watch-description">Loading...</p>

          <div class="watch-info-grid">
            <div class="watch-poster-box">
              <img id="watch-poster" src="" alt="Poster">
            </div>

            <div class="watch-meta-box">
              <div class="watch-meta-grid">
                <div>
                  <span class="meta-label">Status</span>
                  <strong id="watch-status">—</strong>
                </div>

                <div>
                  <span class="meta-label">Country</span>
                  <strong id="watch-country">—</strong>
                </div>

                <div>
                  <span class="meta-label">Genres</span>
                  <strong id="watch-genres">—</strong>
                </div>

                <div>
                  <span class="meta-label">Language</span>
                  <strong id="watch-language">—</strong>
                </div>

                <div id="season-info-item">
                  <span class="meta-label">Season</span>
                  <strong id="watch-season-display">—</strong>
                </div>

                <div id="episode-info-item">
                  <span class="meta-label">Episode</span>
                  <strong id="watch-episode-display">—</strong>
                </div>
              </div>
            </div>
          </div>
        </div>

        <section class="watch-seasons-card" id="watch-seasons-card">
          <div class="section-head">
            <h2>Seasons</h2>
          </div>
          <div id="season-cards" class="season-cards"></div>
        </section>
      </div>

      <aside class="watch-right" id="episode-sidebar">
        <div class="episode-sidebar-top">
          <button type="button" class="server-trigger" id="season-trigger" onclick="openSeasonPanel()">
            <i class="fa-solid fa-layer-group"></i>
            <span id="season-trigger-name">Season 1</span>
            <i class="fa-solid fa-chevron-down server-trigger-caret"></i>
          </button>
          <select id="season-select" class="visually-hidden" aria-hidden="true" tabindex="-1"></select>

          <div class="episode-search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="episode-filter" placeholder="Filter episodes...">
          </div>
        </div>

        <div id="episode-list" class="episode-list-premium"></div>
      </aside>
    </section>

    <div class="search-modal" id="search-modal">
      <div class="search-panel">
        <div class="search-results-head">
          <span class="search-results-title">Search results</span>
          <button class="search-close" type="button" onclick="closeSearchModal()" aria-label="Close search">×</button>
        </div>
        <div class="search-results-grid" id="search-results"></div>
      </div>
    </div>

    <div class="server-modal" id="server-modal">
      <div class="server-panel">
        <div class="server-panel-head">
          <div class="server-panel-title">
            <i class="fa-solid fa-server"></i>
            <div>
              <h3>Streaming Servers</h3>
              <p>Switch if video buffers or fails to play</p>
            </div>
          </div>
          <button class="server-close" type="button" onclick="closeServerPanel()" aria-label="Close">×</button>
        </div>
        <div class="server-list" id="server-list"></div>
      </div>
    </div>

    <div class="server-modal" id="season-modal">
      <div class="server-panel">
        <div class="server-panel-head">
          <div class="server-panel-title">
            <i class="fa-solid fa-layer-group"></i>
            <div>
              <h3>Seasons</h3>
              <p>Pick a season to watch</p>
            </div>
          </div>
          <button class="server-close" type="button" onclick="closeSeasonPanel()" aria-label="Close">×</button>
        </div>
        <div class="server-list" id="season-list"></div>
      </div>
    </div>
  </div>
</body>
</html>
